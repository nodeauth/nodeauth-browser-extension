name: 构建扩展并发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 从 package.json 读取版本号
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 构建版本：v$VERSION"

      - name: 安装依赖
        run: npm install

      - name: 一键构建所有平台产物
        run: npm run build:all

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "## NodeAuth 浏览器扩展 $TAG

          ### 📦 发布产物
          - \`nodeauth-extension-$TAG-chrome.zip\` - Chrome / Edge 版本
          - \`nodeauth-extension-$TAG-firefox.zip\` - Firefox 版本
          - \`nodeauth-source-$TAG.zip\` - Mozilla 审核用源码包"
          fi
          gh release upload "$TAG" release/* --clobber

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: nodeauth-extension-v${{ steps.meta.outputs.version }}
          path: release/
